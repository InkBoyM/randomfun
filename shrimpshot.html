<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Fun</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  #game-wrapper {
    width: 100%;
    max-width: 900px;
  }

  #game-frame {
    width: 100%;
    height: 500px;
    border: 1px solid #fff;
    border-radius: 8px;
    background: #000;
  }

  #controls {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  #fullscreen-btn {
    background: none;
    border: 1px solid #fff;
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #fullscreen-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  #fullscreen-btn:hover {
    background: #fff;
  }

  #fullscreen-btn:hover svg {
    fill: #111;
  }

  #credits {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
    color: #fff;
    opacity: 0.6;
  }

  #game-wrapper:fullscreen #game-frame,
  #game-wrapper:-webkit-full-screen #game-frame {
    height: 100vh;
  }
</style>
</head>
<body>

  <div id="game-wrapper">
    <iframe id="game-frame" src="https://shrimp.templateslide.com/" allowfullscreen></iframe>
    <div id="controls">
      <button id="fullscreen-btn" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="credits">
    Game made by Ilya<br>
    Ported to web by InkBoyM<br>
    Part of Random Fun
  </div>

  <script>
    const wrapper = document.getElementById('game-wrapper');
    const btn = document.getElementById('fullscreen-btn');

    btn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(err => {
          alert(`Couldn't enable fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>

</body>
</html>
